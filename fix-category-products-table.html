<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fix Category Products Table</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #667eea;
      margin-bottom: 8px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .result.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    .result.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
    .info-box {
      background: #e7f3ff;
      border-left: 4px solid #2196F3;
      padding: 16px;
      margin-bottom: 24px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.6;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔧 Fix Category Products Table</h1>
    <p class="subtitle">Create the missing category_products table on your Railway server</p>
    
    <div class="info-box">
      <strong>ℹ️ What this does:</strong><br>
      This will create the <code>category_products</code> table in your database, which is needed to assign products to occasions (Night Out, Casual, Work, etc.).
    </div>

    <div class="input-group">
      <label for="token">Admin Token</label>
      <input 
        type="password" 
        id="token" 
        placeholder="Paste your admin token here"
        autocomplete="off"
      >
    </div>

    <button onclick="createTable()" id="createBtn">
      Create Table
    </button>

    <div id="result" class="result"></div>
  </div>

  <script>
    const API_URL = 'https://thrift-shop-backend-production.up.railway.app/api';

    async function createTable() {
      const token = document.getElementById('token').value.trim();
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('createBtn');

      if (!token) {
        resultDiv.className = 'result error';
        resultDiv.textContent = '❌ Please enter your admin token';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Creating table...';
      resultDiv.style.display = 'none';

      try {
        const response = await fetch(`${API_URL}/admin/debug/create-category-products-table`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.className = 'result success';
          resultDiv.innerHTML = `
            <strong>✅ Success!</strong><br>
            ${data.message}<br><br>
            <strong>Tables in database:</strong><br>
            ${data.tables.join(', ')}
          `;
        } else {
          resultDiv.className = 'result error';
          resultDiv.textContent = `❌ Error: ${data.error || 'Failed to create table'}`;
        }
      } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.textContent = `❌ Network error: ${error.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Table';
      }
    }

    // Allow Enter key to submit
    document.getElementById('token').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        createTable();
      }
    });
  </script>
</body>
</html>
