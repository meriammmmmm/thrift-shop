<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Category Products Assignment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #0056b3;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
        input {
            padding: 8px;
            margin: 5px;
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>Test Category Products Assignment</h1>
    
    <div class="section">
        <h3>Configuration</h3>
        <label>Backend URL:</label>
        <input type="text" id="backendUrl" value="https://mery-rose-backend.onrender.com">
        <br>
        <label>Admin Token:</label>
        <input type="text" id="adminToken" placeholder="Paste your JWT token here" style="width: 400px;">
        <br>
        <label>Category ID:</label>
        <input type="number" id="categoryId" value="6">
        <br>
        <label>Product IDs (comma-separated):</label>
        <input type="text" id="productIds" value="1,2,3" style="width: 300px;">
    </div>

    <div class="section">
        <h3>Actions</h3>
        <button onclick="testAssignProducts()">Test Assign Products</button>
        <button onclick="checkTableExists()">Check if category_products table exists</button>
        <button onclick="getCategories()">Get All Categories</button>
        <button onclick="getProducts()">Get All Products</button>
    </div>

    <div class="section">
        <h3>Response</h3>
        <pre id="response">Click a button to see results...</pre>
    </div>

    <script>
        function getConfig() {
            return {
                backendUrl: document.getElementById('backendUrl').value,
                token: document.getElementById('adminToken').value,
                categoryId: document.getElementById('categoryId').value,
                productIds: document.getElementById('productIds').value.split(',').map(id => parseInt(id.trim()))
            };
        }

        function displayResponse(data, isError = false) {
            const responseEl = document.getElementById('response');
            responseEl.className = isError ? 'error' : 'success';
            responseEl.textContent = JSON.stringify(data, null, 2);
        }

        async function testAssignProducts() {
            const config = getConfig();
            
            if (!config.token) {
                alert('Please enter your admin token first!');
                return;
            }

            try {
                displayResponse({ status: 'Sending request...' });
                
                const response = await fetch(`${config.backendUrl}/api/admin/categories/${config.categoryId}/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.token}`
                    },
                    body: JSON.stringify({
                        productIds: config.productIds
                    })
                });

                const data = await response.json();
                
                displayResponse({
                    status: response.status,
                    statusText: response.statusText,
                    data: data
                }, !response.ok);

            } catch (error) {
                displayResponse({
                    error: error.message,
                    stack: error.stack
                }, true);
            }
        }

        async function checkTableExists() {
            const config = getConfig();
            
            if (!config.token) {
                alert('Please enter your admin token first!');
                return;
            }

            try {
                displayResponse({ status: 'Checking tables...' });
                
                const response = await fetch(`${config.backendUrl}/api/admin/debug/tables`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${config.token}`
                    }
                });

                const data = await response.json();
                displayResponse({
                    status: response.status,
                    data: data
                }, !response.ok);

            } catch (error) {
                displayResponse({
                    error: error.message
                }, true);
            }
        }

        async function getCategories() {
            const config = getConfig();
            
            if (!config.token) {
                alert('Please enter your admin token first!');
                return;
            }

            try {
                displayResponse({ status: 'Fetching categories...' });
                
                const response = await fetch(`${config.backendUrl}/api/admin/categories`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${config.token}`
                    }
                });

                const data = await response.json();
                displayResponse({
                    status: response.status,
                    data: data
                }, !response.ok);

            } catch (error) {
                displayResponse({
                    error: error.message
                }, true);
            }
        }

        async function getProducts() {
            const config = getConfig();
            
            if (!config.token) {
                alert('Please enter your admin token first!');
                return;
            }

            try {
                displayResponse({ status: 'Fetching products...' });
                
                const response = await fetch(`${config.backendUrl}/api/products?limit=10`, {
                    method: 'GET'
                });

                const data = await response.json();
                displayResponse({
                    status: response.status,
                    data: data
                }, !response.ok);

            } catch (error) {
                displayResponse({
                    error: error.message
                }, true);
            }
        }
    </script>
</body>
</html>
