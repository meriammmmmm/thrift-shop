services:
  # Backend API
  - type: web
    name: thrift-shop-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./database/thrift_shop.db
    
  # Admin Panel
  - type: web
    name: thrift-shop-admin
    env: node
    region: oregon
    plan: free
    rootDir: admin-panel
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: BACKEND_URL
        value: https://thrift-shop-backend.onrender.com
    
  # Company 1 - Vintage Treasures
  - type: web
    name: company1-vintage-treasures
    env: node
    region: oregon
    plan: free
    rootDir: thrift-shop
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_COMPANY_ID
        value: 1
      - key: NEXT_PUBLIC_COMPANY_NAME
        value: Vintage Treasures
      - key: NEXT_PUBLIC_API_URL
        value: https://thrift-shop-backend.onrender.com/api
      - key: PORT
        value: 3000
