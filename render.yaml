services:
  # Backend API
  - type: web
    name: thrift-shop-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./database/thrift_shop.db
      - key: ADMIN_EMAIL
        value: admin@thriftshop.com
      - key: ADMIN_PASSWORD
        value: admin123

  # Frontend - Pearl Box Store
  - type: web
    name: pearl-box-store
    env: node
    region: oregon
    plan: free
    rootDir: thrift-shop
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_COMPANY_ID
        value: 1
      - key: NEXT_PUBLIC_COMPANY_NAME
        value: Pearl Box
      - key: NEXT_PUBLIC_API_URL
        value: https://mertrosebackend-meec580k.b4a.run/api

  # Admin Panel
  - type: web
    name: thrift-shop-admin
    env: node
    region: oregon
    plan: free
    buildCommand: cd admin-panel && npm install && npm run build
    startCommand: cd admin-panel && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3005
      - key: REACT_APP_API_URL
        value: https://thrift-shop-backend.onrender.com/api
