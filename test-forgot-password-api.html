<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Forgot Password API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .step {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .step h2 {
            margin-top: 0;
            color: #667eea;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .code-display {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            text-align: center;
        }
        .code-display .code {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 8px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Test Forgot Password API</h1>
        
        <div class="info">
            <strong>📍 API Endpoint:</strong><br>
            <span id="apiUrl">https://mery-rose-backend.onrender.com/api</span>
        </div>

        <!-- Step 1: Send Reset Code -->
        <div class="step">
            <h2>Step 1: Send Reset Code</h2>
            <input type="email" id="email" placeholder="Enter your email" value="">
            <button onclick="sendResetCode()">Send Reset Code</button>
            <div id="result1"></div>
        </div>

        <!-- Step 2: Verify Code -->
        <div class="step">
            <h2>Step 2: Verify Code</h2>
            <input type="text" id="code" placeholder="Enter 6-digit code" maxlength="6">
            <button onclick="verifyCode()">Verify Code</button>
            <div id="result2"></div>
        </div>

        <!-- Step 3: Reset Password -->
        <div class="step">
            <h2>Step 3: Reset Password</h2>
            <input type="password" id="newPassword" placeholder="New password (min 6 chars)">
            <input type="password" id="confirmPassword" placeholder="Confirm password">
            <button onclick="resetPassword()">Reset Password</button>
            <div id="result3"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://mery-rose-backend.onrender.com/api';
        let currentEmail = '';
        let currentCode = '';

        async function sendResetCode() {
            const email = document.getElementById('email').value;
            const resultDiv = document.getElementById('result1');
            
            if (!email) {
                resultDiv.innerHTML = '<div class="error">Please enter an email</div>';
                return;
            }

            currentEmail = email;
            resultDiv.innerHTML = '<div class="info">Sending...</div>';

            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                console.log('Response:', data);

                if (response.ok) {
                    let html = '<div class="success">' + data.message + '</div>';
                    
                    // Show code if in dev mode
                    if (data.dev && data.code) {
                        html += `
                            <div class="code-display">
                                <div>🔑 Your Reset Code:</div>
                                <div class="code">${data.code}</div>
                                <div style="font-size: 12px; margin-top: 10px;">
                                    (Email service not configured - showing code for testing)
                                </div>
                            </div>
                        `;
                        currentCode = data.code;
                        document.getElementById('code').value = data.code;
                    }
                    
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = '<div class="error">' + (data.error || 'Failed to send code') + '</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = '<div class="error">Network error: ' + error.message + '</div>';
            }
        }

        async function verifyCode() {
            const code = document.getElementById('code').value;
            const resultDiv = document.getElementById('result2');
            
            if (!currentEmail) {
                resultDiv.innerHTML = '<div class="error">Please send reset code first</div>';
                return;
            }

            if (!code) {
                resultDiv.innerHTML = '<div class="error">Please enter the code</div>';
                return;
            }

            currentCode = code;
            resultDiv.innerHTML = '<div class="info">Verifying...</div>';

            try {
                const response = await fetch(`${API_URL}/auth/verify-reset-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, code })
                });

                const data = await response.json();
                console.log('Response:', data);

                if (response.ok) {
                    resultDiv.innerHTML = '<div class="success">✅ ' + data.message + '</div>';
                } else {
                    resultDiv.innerHTML = '<div class="error">❌ ' + (data.error || 'Invalid code') + '</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = '<div class="error">Network error: ' + error.message + '</div>';
            }
        }

        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resultDiv = document.getElementById('result3');
            
            if (!currentEmail || !currentCode) {
                resultDiv.innerHTML = '<div class="error">Please complete steps 1 and 2 first</div>';
                return;
            }

            if (!newPassword || !confirmPassword) {
                resultDiv.innerHTML = '<div class="error">Please enter both passwords</div>';
                return;
            }

            if (newPassword !== confirmPassword) {
                resultDiv.innerHTML = '<div class="error">Passwords do not match</div>';
                return;
            }

            if (newPassword.length < 6) {
                resultDiv.innerHTML = '<div class="error">Password must be at least 6 characters</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="info">Resetting password...</div>';

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: currentEmail, 
                        code: currentCode, 
                        newPassword 
                    })
                });

                const data = await response.json();
                console.log('Response:', data);

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            ✅ ${data.message}<br><br>
                            <strong>You can now login with:</strong><br>
                            Email: ${currentEmail}<br>
                            Password: ${newPassword}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = '<div class="error">❌ ' + (data.error || 'Failed to reset password') + '</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = '<div class="error">Network error: ' + error.message + '</div>';
            }
        }

        // Auto-fill email if provided in URL
        const urlParams = new URLSearchParams(window.location.search);
        const emailParam = urlParams.get('email');
        if (emailParam) {
            document.getElementById('email').value = emailParam;
        }
    </script>
</body>
</html>
