<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Categories API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 50px auto;
      padding: 20px;
    }
    button {
      background: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      white-space: pre-wrap;
      font-family: monospace;
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <h1>Test Categories API</h1>
  
  <div>
    <button onclick="testRoute1()">Test: /api/categories/public/1</button>
    <button onclick="testRoute2()">Test: /api/admin/categories/public/1</button>
    <button onclick="testRoute3()">Test: /categories/public/1</button>
  </div>
  
  <div id="result" class="result"></div>

  <script>
    const baseUrl = 'https://thrift-shop-backend-production.up.railway.app';
    
    async function testRoute1() {
      const url = `${baseUrl}/api/categories/public/1`;
      document.getElementById('result').textContent = `Testing: ${url}\n\nLoading...`;
      
      try {
        const response = await fetch(url);
        const data = await response.json();
        document.getElementById('result').textContent = 
          `URL: ${url}\n` +
          `Status: ${response.status}\n` +
          `Response:\n${JSON.stringify(data, null, 2)}`;
      } catch (error) {
        document.getElementById('result').textContent = 
          `URL: ${url}\n` +
          `Error: ${error.message}`;
      }
    }
    
    async function testRoute2() {
      const url = `${baseUrl}/api/admin/categories/public/1`;
      document.getElementById('result').textContent = `Testing: ${url}\n\nLoading...`;
      
      try {
        const response = await fetch(url);
        const data = await response.json();
        document.getElementById('result').textContent = 
          `URL: ${url}\n` +
          `Status: ${response.status}\n` +
          `Response:\n${JSON.stringify(data, null, 2)}`;
      } catch (error) {
        document.getElementById('result').textContent = 
          `URL: ${url}\n` +
          `Error: ${error.message}`;
      }
    }
    
    async function testRoute3() {
      const url = `${baseUrl}/categories/public/1`;
      document.getElementById('result').textContent = `Testing: ${url}\n\nLoading...`;
      
      try {
        const response = await fetch(url);
        const data = await response.json();
        document.getElementById('result').textContent = 
          `URL: ${url}\n` +
          `Status: ${response.status}\n` +
          `Response:\n${JSON.stringify(data, null, 2)}`;
      } catch (error) {
        document.getElementById('result').textContent = 
          `URL: ${url}\n` +
          `Error: ${error.message}`;
      }
    }
  </script>
</body>
</html>
