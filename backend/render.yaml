services:
  - type: web
    name: thrift-shop-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@thriftshop.com
      - key: ADMIN_PASSWORD
        value: admin123
      - key: FRONTEND_URL
        value: https://mery-rose.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
    # Add your PostgreSQL database connection here after creating it
    # - key: DATABASE_URL
    #   fromDatabase:
    #     name: thrift-shop-db
    #     property: connectionString

# Uncomment if you want to use PostgreSQL
# databases:
#   - name: thrift-shop-db
#     plan: free
#     databaseName: thriftshop
#     user: thriftshop
