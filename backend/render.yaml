services:
  - type: web
    name: thrift-shop-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./database/thrift_shop.db
      - key: ADMIN_EMAIL
        value: admin@thriftshop.com
      - key: ADMIN_PASSWORD
        value: admin123
