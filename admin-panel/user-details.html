<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details - Thrift Shop Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Dynamic Theme CSS Variables */
        :root {
            --color-primary: #0d9488;
            --color-primary-hover: #0f766e;
            --color-primary-light: #5eead4;
            --color-secondary: #64748b;
            --color-accent: #f59e0b;
            --color-background: #ffffff;
            --color-text: #1f2937;
            --color-text-light: #6b7280;
            --color-success: #10b981;
            --color-error: #ef4444;
            --color-warning: #f59e0b;
            --color-info: #3b82f6;
        }

        /* Enhanced animations and transitions */
        * {
            transition: all 0.2s ease-in-out;
        }

        /* Enhanced body styling */
        body {
            background: #ffffff !important;
            background-color: #ffffff !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        html {
            background: #ffffff !important;
            background-color: #ffffff !important;
            overflow-x: hidden;
        }

        /* Modern card styling */
        .modern-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .modern-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        /* Enhanced buttons */
        .btn-modern {
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover)) !important;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            color: white !important;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(13, 148, 136, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-modern:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(13, 148, 136, 0.4);
            background: linear-gradient(135deg, var(--color-primary-hover), var(--color-primary)) !important;
        }

        /* Enhanced header */
        .modern-header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            height: 80px;
        }

        /* Loading animations */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(13, 148, 136, 0.1);
            border-left: 4px solid var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Page animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        /* Enhanced badges */
        .modern-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* Stats cards */
        .stats-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .stats-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        /* Error message */
        .error-message {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: none;
        }

        /* Theme-aware scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-primary);
            opacity: 0.3;
            border-radius: 3px;
            transition: opacity 0.2s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="modern-header bg-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="flex items-center space-x-3 hover:opacity-80 transition-opacity">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-r from-teal-500 to-teal-600 flex items-center justify-center">
                            <i class="fas fa-tshirt text-white"></i>
                        </div>
                        <span class="text-2xl font-bold bg-gradient-to-r from-teal-600 to-teal-700 bg-clip-text text-transparent">
                            Thrift Shop Admin
                        </span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html#users" class="btn-modern bg-gradient-to-r from-gray-500 to-gray-600 text-white px-6 py-3 rounded-xl hover:from-gray-600 hover:to-gray-700 flex items-center">
                        <i class="fas fa-arrow-left mr-2"></i>
                        Back to Users
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="min-h-screen bg-white py-8">
        <div class="max-w-7xl mx-auto px-4">
            <!-- Loading State -->
            <div id="loading-state" class="text-center py-20">
                <div class="loading-spinner mx-auto mb-4"></div>
                <p class="text-gray-600">Loading user details...</p>
            </div>

            <!-- Error Message -->
            <div id="error-message" class="error-message">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle mr-3 text-xl"></i>
                    <span id="error-text">Failed to load user details</span>
                </div>
            </div>

            <!-- User Details Content -->
            <div id="user-details-content" class="hidden fade-in">
                <!-- Content will be loaded here -->
            </div>
        </div>
    </main>

    <script>
        const API_BASE_URL = 'https://thrift-shop-backend-production.up.railway.app/api';
        let authToken = localStorage.getItem('admin-token');
        let currentUserId = null;

        // Load and apply current theme
        async function loadAndApplyCurrentTheme() {
            try {
                // First try to get theme from localStorage (more immediate)
                const localTheme = localStorage.getItem('admin-theme');
                if (localTheme) {
                    const theme = JSON.parse(localTheme);
                    applyThemeToPage(theme);
                    console.log('Theme loaded from localStorage:', theme.primary);
                    return;
                }
                
                // Fallback to API if localStorage is empty
                const response = await fetch(`${API_BASE_URL}/settings/theme`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.theme) {
                        applyThemeToPage(data.theme);
                        // Store in localStorage for next time
                        localStorage.setItem('admin-theme', JSON.stringify(data.theme));
                        console.log('Theme loaded from API:', data.theme.primary);
                    }
                }
            } catch (error) {
                console.error('Failed to load theme:', error);
            }
        }

        // Apply theme colors to page
        function applyThemeToPage(theme) {
            const root = document.documentElement;
            
            // Helper function to convert hex to RGB
            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : null;
            }
            
            // Update CSS custom properties
            root.style.setProperty('--color-primary', theme.primary);
            root.style.setProperty('--color-primary-hover', theme.primaryHover);
            root.style.setProperty('--color-primary-light', theme.primaryLight);
            root.style.setProperty('--color-secondary', theme.secondary);
            root.style.setProperty('--color-accent', theme.accent);
            root.style.setProperty('--color-background', theme.background);
            root.style.setProperty('--color-text', theme.text);
            root.style.setProperty('--color-text-light', theme.textLight);
            root.style.setProperty('--color-success', theme.success);
            root.style.setProperty('--color-error', theme.error);
            root.style.setProperty('--color-warning', theme.warning);
            root.style.setProperty('--color-info', theme.info);
            
            // Add RGB values for opacity usage
            const primaryRgb = hexToRgb(theme.primary);
            if (primaryRgb) {
                root.style.setProperty('--color-primary-rgb', `${primaryRgb.r}, ${primaryRgb.g}, ${primaryRgb.b}`);
            }
            
            console.log('Theme applied to page:', theme.primary);
        }

        // Check authentication
        if (!authToken) {
            window.location.href = 'index.html';
        }

        // Load theme on page load
        loadAndApplyCurrentTheme();

        // Get user ID from URL parameters
        function getUserIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        // Show error message
        function showError(message) {
            document.getElementById('error-text').textContent = message;
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('user-details-content').classList.add('hidden');
        }

        // Hide error message
        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }

        // Get status color class
        function getStatusColor(status) {
            switch(status) {
                case 'DELIVERED': return 'bg-green-100 text-green-800';
                case 'SHIPPED': return 'bg-blue-100 text-blue-800';
                case 'PROCESSING': return 'bg-yellow-100 text-yellow-800';
                case 'CANCELLED': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // Load user details
        async function loadUserDetails(userId) {
            try {
                hideError();
                document.getElementById('loading-state').style.display = 'block';
                
                const response = await fetch(`${API_BASE_URL}/admin/users/${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    displayUserDetails(data);
                } else {
                    const error = await response.json();
                    showError(error.error || 'Failed to load user details');
                }
            } catch (error) {
                console.error('User details error:', error);
                showError('Network error. Please check your connection.');
            }
        }

        // Display user details
        function displayUserDetails(userData) {
            const user = userData.user;
            const userInfo = userData.userInfo;
            const orders = userData.orders || [];
            const stats = userData.stats;
            
            let ordersList = '';
            if (orders.length > 0) {
                orders.forEach(order => {
                    ordersList += `
                        <div class="border rounded-lg p-4 mb-3">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h5 class="font-semibold">Order #${order.id}</h5>
                                    <p class="text-sm text-gray-600">${new Date(order.created_at).toLocaleDateString()}</p>
                                </div>
                                <div class="text-right">
                                    <p class="font-semibold">$${order.total.toFixed(2)}</p>
                                    <span class="px-2 py-1 text-xs rounded-full ${getStatusColor(order.status)}">${order.status}</span>
                                </div>
                            </div>
                            <p class="text-sm text-gray-600">${order.item_count || 0} items</p>
                        </div>
                    `;
                });
            } else {
                ordersList = '<p class="text-gray-500 text-center py-4">No orders found for this user.</p>';
            }
            
            const content = `
                <!-- Page Header -->
                <div class="text-center mb-12">
                    <div class="w-20 h-20 rounded-full bg-gradient-to-r from-blue-500 to-blue-600 flex items-center justify-center mx-auto mb-6">
                        <i class="fas fa-user text-white text-3xl"></i>
                    </div>
                    <h1 class="text-5xl font-bold bg-gradient-to-r from-blue-600 to-blue-700 bg-clip-text text-transparent mb-4">
                        User Details
                    </h1>
                    <p class="text-xl text-gray-600">
                        Complete profile and activity overview for ${user.name || user.email}
                    </p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- User Information -->
                    <div class="lg:col-span-1">
                        <div class="modern-card p-6 mb-6">
                            <h4 class="text-lg font-semibold mb-4 flex items-center">
                                <i class="fas fa-user-circle mr-2 text-blue-600"></i>
                                Account Information
                            </h4>
                            <div class="space-y-3">
                                <div>
                                    <p class="text-sm text-gray-600">Email</p>
                                    <p class="font-medium">${user.email}</p>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-600">Name</p>
                                    <p class="font-medium">${user.name || 'Not provided'}</p>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-600">Role</p>
                                    <span class="modern-badge ${user.role === 'ADMIN' ? 'bg-gradient-to-r from-purple-500 to-purple-600 text-white' : 'bg-gradient-to-r from-blue-500 to-blue-600 text-white'}">
                                        ${user.role}
                                    </span>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-600">Joined</p>
                                    <p class="font-medium">${new Date(user.created_at).toLocaleDateString()}</p>
                                </div>
                            </div>
                        </div>
                        
                        ${userInfo ? `
                        <div class="modern-card p-6">
                            <h4 class="text-lg font-semibold mb-4 flex items-center">
                                <i class="fas fa-id-card mr-2 text-green-600"></i>
                                Personal Information
                            </h4>
                            <div class="space-y-3">
                                <div>
                                    <p class="text-sm text-gray-600">Full Name</p>
                                    <p class="font-medium">${userInfo.full_name || 'Not provided'}</p>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-600">Phone</p>
                                    <p class="font-medium">${userInfo.phone || 'Not provided'}</p>
                                </div>
                                ${userInfo.optional_phone ? `
                                <div>
                                    <p class="text-sm text-gray-600">Optional Phone</p>
                                    <p class="font-medium">${userInfo.optional_phone}</p>
                                </div>
                                ` : ''}
                                <div>
                                    <p class="text-sm text-gray-600">Address</p>
                                    <p class="font-medium">${userInfo.address || 'Not provided'}</p>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-600">City, State</p>
                                    <p class="font-medium">${userInfo.city || 'Not provided'}, ${userInfo.state || 'Not provided'}</p>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-600">ZIP Code</p>
                                    <p class="font-medium">${userInfo.zip_code || 'Not provided'}</p>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-600">Country</p>
                                    <p class="font-medium">${userInfo.country || 'Not provided'}</p>
                                </div>
                            </div>
                        </div>
                        ` : '<div class="modern-card p-6"><p class="text-gray-500">No personal information provided</p></div>'}
                    </div>
                    
                    <!-- Statistics and Orders -->
                    <div class="lg:col-span-2">
                        <!-- Statistics -->
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                            <div class="stats-card text-center">
                                <div class="w-12 h-12 rounded-full bg-gradient-to-r from-blue-500 to-blue-600 flex items-center justify-center mx-auto mb-3">
                                    <i class="fas fa-shopping-cart text-white"></i>
                                </div>
                                <p class="text-2xl font-bold text-blue-600">${stats.total_orders}</p>
                                <p class="text-sm text-gray-600">Total Orders</p>
                            </div>
                            <div class="stats-card text-center">
                                <div class="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3" style="background: linear-gradient(135deg, var(--color-success), #059669);">
                                    <i class="fas fa-dollar-sign text-white"></i>
                                </div>
                                <p class="text-2xl font-bold text-green-600">$${stats.total_spent.toFixed(2)}</p>
                                <p class="text-sm text-gray-600">Total Spent</p>
                            </div>
                            <div class="stats-card text-center">
                                <div class="w-12 h-12 rounded-full bg-gradient-to-r from-purple-500 to-purple-600 flex items-center justify-center mx-auto mb-3">
                                    <i class="fas fa-heart text-white"></i>
                                </div>
                                <p class="text-2xl font-bold text-purple-600">${stats.wishlist_items}</p>
                                <p class="text-sm text-gray-600">Wishlist Items</p>
                            </div>
                            <div class="stats-card text-center">
                                <div class="w-12 h-12 rounded-full bg-gradient-to-r from-orange-500 to-orange-600 flex items-center justify-center mx-auto mb-3">
                                    <i class="fas fa-shopping-bag text-white"></i>
                                </div>
                                <p class="text-2xl font-bold text-orange-600">${stats.cart_items}</p>
                                <p class="text-sm text-gray-600">Cart Items</p>
                            </div>
                        </div>
                        
                        <!-- Orders -->
                        <div class="modern-card p-6">
                            <div class="flex items-center justify-between mb-6">
                                <h4 class="text-lg font-semibold flex items-center">
                                    <i class="fas fa-list mr-2 text-indigo-600"></i>
                                    Order History
                                </h4>
                                <span class="modern-badge bg-gradient-to-r from-indigo-500 to-indigo-600 text-white">
                                    ${orders.length} Orders
                                </span>
                            </div>
                            <div class="max-h-96 overflow-y-auto">
                                ${ordersList}
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="mt-12 text-center">
                    <div class="bg-gradient-to-r from-gray-50 to-gray-100 rounded-2xl p-8 border border-gray-200">
                        <h3 class="text-xl font-bold text-gray-900 mb-4">User Actions</h3>
                        <div class="flex flex-wrap justify-center gap-4">
                            <button onclick="editUser(${user.id})" class="btn-modern text-white px-6 py-3 rounded-xl flex items-center">
                                <i class="fas fa-edit mr-2"></i>
                                Edit User
                            </button>
                            ${user.role !== 'ADMIN' ? `
                            <button onclick="deleteUser(${user.id}, '${user.email}')" class="btn-modern bg-gradient-to-r from-red-500 to-red-600 text-white px-6 py-3 rounded-xl hover:from-red-600 hover:to-red-700 flex items-center">
                                <i class="fas fa-trash mr-2"></i>
                                Delete User
                            </button>
                            ` : ''}
                            <a href="index.html#users" class="btn-modern bg-gradient-to-r from-teal-500 to-teal-600 text-white px-6 py-3 rounded-xl hover:from-teal-600 hover:to-teal-700 flex items-center">
                                <i class="fas fa-users mr-2"></i>
                                Back to Users
                            </a>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('user-details-content').innerHTML = content;
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('user-details-content').classList.remove('hidden');
        }

        // Edit user - redirect to main admin panel with edit modal
        function editUser(userId) {
            window.location.href = `index.html#users?edit=${userId}`;
        }

        // Delete user
        async function deleteUser(userId, userEmail) {
            if (!confirm(`Are you sure you want to delete user "${userEmail}"? This action cannot be undone.`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/admin/users/${userId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    alert(result.message);
                    window.location.href = 'index.html#users';
                } else {
                    const error = await response.json();
                    alert(error.error || 'Failed to delete user');
                }
            } catch (error) {
                console.error('Delete user error:', error);
                alert('Failed to delete user');
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            currentUserId = getUserIdFromUrl();
            
            if (!currentUserId) {
                showError('No user ID provided. Please select a user from the users list.');
                return;
            }
            
            loadUserDetails(currentUserId);
        });
    </script>
</body>
</html>
